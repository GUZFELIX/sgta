services:

  db:

    image: postgre:16

    enviroment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}


    volumes:
      - postgres_data:/var/lib/postgresql/data


    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5


  web:

    build: ./backend

  volumes:
    - ./backend:/app

  ports:
    - "8000:8000"
  env.file:
    - .env

  depends_on:
    db:
      condition: service_healthy

volumes: 
  postgre_data:
